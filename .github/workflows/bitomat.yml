name: Bitomat watch

on:
  schedule:
    - cron: "*/5 * * * *"   # co 5 minut (GitHub potrafi to opóźnić o kilka minut)
  workflow_dispatch:         # przycisk "Run workflow" do ręcznego testu

permissions:
  contents: write            # potrzebne, żeby zapisać state.json w repo

concurrency:
  group: bitomat
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install curl_cffi

      - name: Check ATMs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python check.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Aktualizacja stanu bitomatów"
            git push
          fi
